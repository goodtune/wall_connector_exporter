# Example configuration for wall_connector_exporter.
#
# Each charger has its own poll. One exporter can poll many chargers.

devices:
  # The value of the "device" label of all metrics of this charger.
  - name: garage
    # Host name or IP address of the charger. The API is on port 80.
    address: 192.0.2.10

  # A second charger, with all the settings that a charger can have.
  - name: carport
    # Give host:port when the API is not on port 80.
    address: 192.0.2.11:80
    # Shortest time between two polls. Not less than 5s.
    poll_interval: 30s
    # Timeout of one HTTP request.
    timeout: 3s
    # Pause between two requests of one poll.
    request_pause: 200ms
    # Set this for a split-phase supply. It changes how the exporter
    # calculates wall_connector_charging_power_watts.
    split_phase: true
